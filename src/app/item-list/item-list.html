<div class="container py-4">

  <div class="mb-4">
    <h2 class="fw-bold mb-1">Listado de equipos en reparacion</h2>
    <p class="text-muted mb-0">Gestiona los dispositivos que estan en taller</p>
  </div>
  <div class="card border-0 shadow-sm mb-5 form-card">
    <div class="card-body p-4">
      <h6 class="card-subtitle mb-3 text-uppercase small fw-bold text-primary">
        ➕ Agregar nuevo equipo
      </h6>

      <form
        #itemForm="ngForm"
        class="row g-3 align-items-end"
        (ngSubmit)="agregarItem(nombreInput.value, descripcionInput.value, estadoSelect.value); itemForm.resetForm()"
      >
        <div class="col-md-4">
          <label for="nombre" class="form-label fw-semibold">Nombre</label>
          <input
            #nombreInput
            type="text"
            id="nombre"
            name="nombre"
            class="form-control"
            placeholder="Ej. Samsung S21"
            required
          />
        </div>

        <div class="col-md-4">
          <label for="descripcion" class="form-label fw-semibold">Descripcion</label>
          <input
            #descripcionInput
            type="text"
            id="descripcion"
            name="descripcion"
            class="form-control"
            placeholder="Ej. Cambio de bateria"
            required
          />
        </div>

        <div class="col-md-2">
          <label for="estado" class="form-label fw-semibold">Estado</label>
          <select #estadoSelect id="estado" name="estado" class="form-select">
            <option value="Pendiente">Pendiente</option>
            <option value="En reparacion">En reparacion</option>
            <option value="Listo">Listo</option>
          </select>
        </div>

        <div class="col-md-2">
          <button type="submit" class="btn btn-primary w-100 fw-semibold">
            Agregar
          </button>
        </div>
      </form>
    </div>
  </div>
  
  <h6 class="text-uppercase small fw-bold text-muted mb-3">
    Equipos registrados ({{ items.length }})
  </h6>

  <ul class="list-unstyled">
    <li *ngFor="let item of items">
      <app-item-card [item]="item"></app-item-card>
    </li>
  </ul>

  <div *ngIf="items.length === 0" class="alert alert-light border text-center text-muted">
    Aun no hay elementos en el listado.
  </div>

</div>
